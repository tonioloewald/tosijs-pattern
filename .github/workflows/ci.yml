name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pins (Node 24 releases, by SHA) copied from tosijs-coding-practices/templates/publish.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # Every live example in the docs, against the source (stub preview).
      - run: bun scripts/run-examples.ts README.md docs-src/*.md
      # What npm ships builds clean (dist/ is not committed).
      - run: bun run build:lib
